<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lazy Yoots</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --red: #e10600;
  --soft-red: rgba(225, 6, 0, 0.15);
  --black: #111;
  --gray: #777;
  --border: #eee;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
}

body {
  background: #fff;
  color: var(--black);
  overflow-x: hidden;
  transition: 0.3s;
}

.animated-bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: linear-gradient(120deg, #fff, var(--soft-red), #fff);
  background-size: 400% 400%;
  animation: bgMove 16s ease infinite;
}

@keyframes bgMove {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

.cursor-blob {
  position: fixed;
  width: 260px;
  height: 260px;
  background: rgba(225, 6, 0, 0.18);
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
  z-index: -1;
  transition: transform 0.15s linear;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  position: sticky;
  top: 0;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.logo img {
  height: 50px;
  cursor: pointer;
}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: var(--black);
  font-weight: 500;
}

nav a:hover {
  color: var(--red);
}

.hero {
  padding: 120px 40px;
  text-align: center;
}

.hero h1 {
  font-size: 56px;
  margin-bottom: 15px;
}

.hero span {
  color: var(--red);
}

.hero p {
  color: var(--gray);
  margin-bottom: 30px;
}

.hero button {
  background: var(--red);
  color: #fff;
  border: none;
  padding: 15px 40px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 12px 30px rgba(225, 6, 0, 0.3);
}

body.dark {
  background: #0f0f0f;
  color: #fff;
}

body.dark header,
body.dark .card,
body.dark .feature,
body.dark footer {
  background: rgba(20, 20, 20, 0.85);
  color: #fff;
  border-color: #222;
}

body.dark nav a {
  color: #ddd;
}

.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 25px;
  padding: 60px 40px;
}

.feature {
  background: rgba(255, 255, 255, 0.9);
  padding: 25px;
  border-radius: 20px;
  border: 1px solid var(--border);
  text-align: center;
  transition: 0.3s;
  backdrop-filter: blur(8px);
}

.feature:hover {
  transform: translateY(-6px);
  border-color: var(--red);
}

footer {
  border-top: 1px solid var(--border);
  padding: 30px;
  text-align: center;
  color: var(--gray);
  background: rgba(255, 255, 255, 0.9);
}
</style>
</head>
<body>

<div class="animated-bg"></div>
<div class="cursor-blob" id="blob"></div>

<header>
  <div class="logo">
    <img src="WhatsApp Image 2025-12-20 at 16.25.10 (1).jpeg" alt="Lazy Yoots Logo">
  </div>
  <nav>
    <a href="#features">Features</a>
    <a href="shop.html">Shop</a>
    <a href="#" onclick="toggleDark()">
      <img src="night-mode.png" alt="Dark Mode" style="height:28px; width:28px; cursor:pointer;">
    </a>
  </nav>
</header>

<section class="hero">
  <h1><span>Lazy Yoots</span></h1>
  <p>Minimal fashion marketplace with interactive motion design.</p>
  <button onclick="scrollToFeatures()">Explore Features</button>
</section>

<section class="features" id="features">
  <div class="feature">
    <h3>Fast Delivery</h3>
    <p>Nationwide shipping</p>
  </div>
  <div class="feature">
    <h3>Secure Payment</h3>
    <p>Trusted gateways</p>
  </div>
  <div class="feature">
    <h3>Premium Fabric</h3>
    <p>Built for comfort</p>
  </div>
</section>

<footer>© 2025 Lazy Yoots — Fashion in Motion</footer>

<script>
document.addEventListener("mousemove", e => {
  document.getElementById("blob").style.transform = `translate(${e.clientX - 130}px, ${e.clientY - 130}px)`;
});

function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}

function scrollToFeatures() {
  document.getElementById("features").scrollIntoView({ behavior: "smooth" });
}

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}
</script>

</body>
</html>
