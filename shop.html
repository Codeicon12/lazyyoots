<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lazy Yoots Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #e10600;
  --soft-red: rgba(225, 6, 0, 0.15);
  --black: #111;
  --gray: #777;
  --border: #eee;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
}

body {
  background: #fff;
  color: var(--black);
  overflow-x: hidden;
  transition: 0.3s;
}

.animated-bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: linear-gradient(120deg, #fff, var(--soft-red), #fff);
  background-size: 400% 400%;
  animation: bgMove 16s ease infinite;
}

@keyframes bgMove {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

.cursor-blob {
  position: fixed;
  width: 260px;
  height: 260px;
  background: rgba(225, 6, 0, 0.18);
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
  z-index: -1;
  transition: transform 0.15s linear;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  position: sticky;
  top: 0;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.logo img {
  height: 50px;
  cursor: pointer;
}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: var(--black);
  font-weight: 500;
}

nav a:hover {
  color: var(--red);
}

.products {
  padding: 60px 40px;
}

.products h2 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 30px;
}

.card {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--border);
  border-radius: 22px;
  overflow: hidden;
  transition: transform 0.4s;
  backdrop-filter: blur(8px);
}

.card:hover {
  transform: rotateX(6deg) rotateY(-6deg) translateY(-8px);
}

.card img {
  width: 100%;
  height: 260px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  color: var(--red);
  font-weight: 600;
  margin-bottom: 12px;
}

.card button {
  width: 100%;
  border: none;
  padding: 12px;
  border-radius: 25px;
  background: var(--red);
  color: #fff;
  cursor: pointer;
}

.cart-panel {
  position: fixed;
  top: 0;
  right: -100%;
  width: 350px;
  height: 100vh;
  background: #fff;
  box-shadow: -10px 0 30px rgba(0, 0, 0, 0.15);
  padding: 20px;
  transition: 0.4s;
  z-index: 20;
}

.cart-panel.open {
  right: 0;
}

.cart-panel h3 {
  margin-bottom: 20px;
}

.cart-item {
  display: flex;
  align-items: center;
  margin-bottom: 15px;
}

.cart-item img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  margin-right: 15px;
  border-radius: 10px;
}

.cart-item-details h4 {
  margin-bottom: 5px;
  font-size: 16px;
}

.cart-item-details span {
  font-size: 14px;
  color: var(--gray);
}

.cart-item button {
  background: var(--red);
  color: #fff;
  border: none;
  padding: 5px 10px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  margin-left: auto;
}

#cartTotal {
  font-weight: 600;
  margin-top: 10px;
  display: block;
  text-align: right;
}

.checkout-form {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.checkout-form input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: var(--red);
  color: #fff;
  padding: 14px 20px;
  border-radius: 30px;
  display: none;
}

body.dark {
  background: #0f0f0f;
  color: #fff;
}

body.dark header,
body.dark .card,
body.dark .cart-panel {
  background: rgba(20, 20, 20, 0.85);
  color: #fff;
  border-color: #222;
}

body.dark nav a {
  color: #ddd;
}

@media (max-width: 768px) {
  header {
    flex-direction: column;
    align-items: flex-start;
    padding: 15px 20px;
  }

  nav {
    margin-top: 10px;
  }

  .products {
    padding: 40px 20px;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .card img {
    height: 200px;
  }

  .cart-panel {
    width: 80%;
  }
}
</style>
</head>
<body>

<div class="animated-bg"></div>
<div class="cursor-blob" id="blob"></div>

<header>
  <div class="logo"><img src="WhatsApp Image 2025-12-20 at 16.25.10 (1).jpeg" alt="Lazy Yoots Logo"></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="#products">Shop</a>
    <a href="admin.html">Admin</a>
    <a href="#" onclick="toggleCart()">Cart <span id="cartCount">0</span></a>
    <a href="#" onclick="toggleDark()"><img src="night-mode.png" alt="Dark Mode" style="height:28px;width:28px;cursor:pointer;"></a>
  </nav>
</header>

<section class="products" id="products">
  <h2>Our Collection</h2>
  <div class="grid" id="productGrid">
    <!-- Products will render here -->
  </div>
</section>

<div class="cart-panel" id="cartPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <h3>Your Cart</h3>
    <button onclick="toggleCart()" style="background:none;border:none;font-size:20px;cursor:pointer;">✖</button>
  </div>
  <div id="cartItems"></div>
  <span id="cartTotal">Total: ₦0</span>
  
  <div class="checkout-form" id="checkoutForm" style="display:none;">
    <h4>Checkout</h4>
    <input type="text" id="customerName" placeholder="Your Name" required><br>
    <input type="email" id="customerEmail" placeholder="Your Email (optional)"><br>
    <button onclick="placeOrder()">Place Order</button>
  </div>
  
  <button id="checkoutButton" onclick="showCheckout()">Checkout</button>
</div>

<div class="toast" id="toast">Added to cart ✔</div>

<script>
// Use environment variable for API base URL, fallback to localhost for development
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? "http://localhost:3000/api"
  : "https://your-backend-url.railway.app/api"; // Replace with your actual backend URL after deployment

const cart = [];
let products = []; // Make products global
const grid = document.getElementById("productGrid");
const cartPanel = document.getElementById("cartPanel");
const cartItemsDiv = document.getElementById("cartItems");
const cartCount = document.getElementById("cartCount");
const toast = document.getElementById("toast");
const checkoutForm = document.getElementById("checkoutForm");
const checkoutButton = document.getElementById("checkoutButton");

async function fetchProducts() {
  try {
    const res = await fetch(`${API_BASE}/shop/products`);
    products = await res.json(); // Assign to global products
    renderProducts(products);
  } catch (error) {
    console.error("Error fetching products:", error);
    alert("An error occurred while loading products. Please check the console for details.");
  }
}

function renderProducts(products) {
  grid.innerHTML = "";
  if (products.length === 0) {
    grid.innerHTML = "<p style='text-align:center; grid-column: 1 / -1;'>No products available at the moment.</p>";
    return;
  }
  
  products.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${p.image_url}" alt="${p.name}">
      <div class="card-content">
        <h3>${p.name}</h3>
        <div class="price">₦${p.price}</div>
        <p>Stock: ${p.stock}</p>
        <button onclick="addToCart(${i})" ${p.stock <= 0 ? 'disabled style="background: #ccc; cursor: not-allowed;"' : ''}>${p.stock <= 0 ? 'Out of Stock' : 'Add to Cart'}</button>
      </div>`;
    grid.appendChild(card);
  });
}

function addToCart(i) {
  const product = products[i];
  
  // Check if product is in stock
  if (product.stock <= 0) {
    alert("This product is out of stock.");
    return;
  }
  
  const cartItem = cart.find(item => item.id === product.id);
  if (cartItem) {
    // Check if adding would exceed stock
    if (cartItem.qty >= product.stock) {
      alert("You've reached the maximum available stock for this item.");
      return;
    }
    cartItem.qty++;
  } else {
    // Check if we can add at least 1 item
    if (product.stock < 1) {
      alert("This product is out of stock.");
      return;
    }
    cart.push({ ...product, qty: 1 });
  }
  updateCart();
  showToast("Added to cart ✔");
}

function updateCart() {
  cartItemsDiv.innerHTML = "";
  let total = 0;
  cart.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <img src="${item.image_url}" alt="${item.name}">
      <div class="cart-item-details">
        <h4>${item.name}</h4>
        <span>₦${item.price} x ${item.qty}</span>
      </div>
      <button onclick="removeCartItem(${i})">Remove</button>
    `;
    cartItemsDiv.appendChild(div);
    total += parseInt(item.price) * item.qty;
  });
  cartCount.textContent = cart.reduce((acc, item) => acc + item.qty, 0);
  document.getElementById("cartTotal").textContent = `Total: ₦${total}`;
  
  // Show/hide checkout button based on cart contents
  checkoutButton.style.display = cart.length > 0 ? 'block' : 'none';
  checkoutForm.style.display = 'none'; // Hide checkout form by default
}

function removeCartItem(i) {
  cart.splice(i, 1);
  updateCart();
  showToast("Removed from cart ✔");
}

function toggleCart() {
  cartPanel.classList.toggle("open");
}

function showCheckout() {
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }
  checkoutForm.style.display = 'block';
}

async function placeOrder() {
  const customerName = document.getElementById("customerName").value;
  const customerEmail = document.getElementById("customerEmail").value;

  if (!customerName) {
    alert("Please enter your name.");
    return;
  }

  // Prepare order items
  const orderItems = cart.map(item => ({
    product_id: item.id,
    quantity: item.qty,
    price: item.price
  }));

  const orderData = {
    customer_name: customerName,
    customer_email: customerEmail || null,
    items: orderItems
  };

  try {
    const response = await fetch(`${API_BASE}/shop/orders`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(orderData)
    });

    if (!response.ok) {
      const errorData = await response.json();
      console.error("Failed to place order:", errorData);
      alert(errorData.error || "Failed to place order. Please check the console for details.");
      return;
    }

    const order = await response.json();
    alert(`Order placed successfully! Order ID: ${order.id}`);
    
    // Clear cart
    cart.length = 0;
    updateCart();
    
    // Reset form
    document.getElementById("customerName").value = "";
    document.getElementById("customerEmail").value = "";
    checkoutForm.style.display = 'none';
    
    // Close cart panel
    toggleCart();
    
  } catch (error) {
    console.error("Error placing order:", error);
    alert("An error occurred while placing your order. Please check the console for details.");
  }
}

function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}

function showToast(msg) {
  toast.textContent = msg;
  toast.style.display = "block";
  setTimeout(() => (toast.style.display = "none"), 2000);
}

document.addEventListener("mousemove", e => {
  document.getElementById("blob").style.transform = `translate(${e.clientX - 130}px, ${e.clientY - 130}px)`;
});

fetchProducts();

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}
</script>

</body>
</html>
